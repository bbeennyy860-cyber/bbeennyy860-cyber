<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Benedict Anokye-Davies, TEMPEST research engineering</title>
  <desc id="desc">A restrained graphite command console with an amber radial intelligence core and cyan telemetry details.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030709"/>
      <stop offset="0.55" stop-color="#071015"/>
      <stop offset="1" stop-color="#020506"/>
    </linearGradient>
    <radialGradient id="core" cx="48%" cy="42%" r="58%">
      <stop offset="0" stop-color="#fff6d7"/>
      <stop offset="0.2" stop-color="#ffd57b"/>
      <stop offset="0.55" stop-color="#f2a622"/>
      <stop offset="1" stop-color="#5e3200"/>
    </radialGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#ffd788" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7fd7e8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="10" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="10" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="9" fill="none" stroke="#1d3941" stroke-width="2"/>
  <path d="M1 52H1200M1 255H1200" stroke="#143039" stroke-width="1"/>
  <path d="M356 52V255" stroke="#24444c" stroke-width="1"/>

  <!-- Corner registration marks -->
  <g fill="none" stroke="#5bb9cb" stroke-width="2" opacity="0.62">
    <path d="M18 34V18H34M1166 18H1182V34M18 266V282H34M1166 282H1182V266"/>
  </g>

  <!-- Header rail -->
  <circle cx="30" cy="34" r="4" fill="#f5a623" filter="url(#softGlow)"/>
  <text x="45" y="39" fill="#a7c8cf" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2.4">TEMPEST // RESEARCH ENGINEERING</text>
  <text x="1168" y="39" text-anchor="end" fill="#52747c" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.8">PROFILE_NODE 01</text>

  <!-- Radial core -->
  <g transform="translate(178 154)">
    <circle r="100" fill="none" stroke="#3b7d8a" stroke-width="1" stroke-dasharray="2 8" opacity="0.38"/>
    <circle r="82" fill="none" stroke="#f5a623" stroke-width="1.25" stroke-dasharray="18 9 3 9" opacity="0.72"/>
    <circle r="62" fill="none" stroke="#49b7ca" stroke-width="1" stroke-dasharray="2 6" opacity="0.4"/>
    <ellipse rx="110" ry="38" fill="none" stroke="#f5a623" stroke-width="1.5" opacity="0.75" transform="rotate(-17)"/>
    <ellipse rx="105" ry="31" fill="none" stroke="#53c5d8" stroke-width="1" opacity="0.38" transform="rotate(57)"/>
    <ellipse rx="92" ry="25" fill="none" stroke="#f5a623" stroke-width="1" opacity="0.45" transform="rotate(104)"/>

    <g stroke="#5fc7d8" stroke-width="1" opacity="0.45">
      <path d="M-122 0H-78M78 0H122M0-112V-75M0 75V112"/>
      <path d="M-77-77L-54-54M77-77L54-54M-77 77L-54 54M77 77L54 54"/>
    </g>

    <circle r="33" fill="#f5a623" opacity="0.13" filter="url(#glow)"/>
    <circle r="23" fill="url(#core)" filter="url(#glow)"/>
    <circle r="8" fill="#fff8df"/>
    <circle cx="-7" cy="-8" r="4" fill="#ffffff" opacity="0.92"/>

    <circle cx="-93" cy="-35" r="3" fill="#f5a623" filter="url(#softGlow)"/>
    <circle cx="75" cy="-56" r="2.5" fill="#6bd4e5" filter="url(#softGlow)"/>
    <circle cx="68" cy="69" r="2" fill="#f5a623"/>
  </g>

  <text x="178" y="272" text-anchor="middle" fill="#6d9299" font-family="Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="2">EVIDENCE &gt; ASSUMPTION</text>

  <!-- Identity block -->
  <text x="402" y="101" fill="#f4f7f8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="1.2">BENEDICT ANOKYE-DAVIES</text>
  <rect x="403" y="118" width="594" height="2" fill="url(#amberLine)"/>
  <text x="402" y="151" fill="#f2b84f" font-family="Consolas, 'Liberation Mono', monospace" font-size="17" letter-spacing="2.5">SYSTEMS // AI // SIMULATION</text>
  <text x="402" y="184" fill="#a9bdc2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Building dependable software with explicit state, bounded authority</text>
  <text x="402" y="209" fill="#a9bdc2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">and evidence that survives contact with failure.</text>

  <!-- Status tokens -->
  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.4">
    <rect x="402" y="228" width="198" height="27" rx="3" fill="#0c1a1f" stroke="#28505a"/>
    <circle cx="418" cy="241.5" r="3" fill="#65cf85"/>
    <text x="429" y="246" fill="#9db8be">UON // CS + AI</text>

    <rect x="612" y="228" width="240" height="27" rx="3" fill="#0c1a1f" stroke="#28505a"/>
    <circle cx="628" cy="241.5" r="3" fill="#f5a623"/>
    <text x="639" y="246" fill="#9db8be">TEMPEST // PRIVATE</text>

    <rect x="864" y="228" width="240" height="27" rx="3" fill="#0c1a1f" stroke="#28505a"/>
    <circle cx="880" cy="241.5" r="3" fill="#5fc7d8"/>
    <text x="891" y="246" fill="#9db8be">READING // UK</text>
  </g>

  <text x="1170" y="276" text-anchor="end" fill="#385a62" font-family="Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1.5">BUILD / VERIFY / LEARN</text>
</svg>
